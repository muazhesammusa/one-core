name: frontend-design-skill
description: "Generates 1:1 pixel-perfect, premium React or Vanilla JS frontend components for CloudFold Pro based on provided images, strict metadata specifications, and snappy motion tokens."

trigger_conditions:
  - "User uploads an image/screenshot and asks to convert it to code."
  - "User requests a new UI component for the CloudFold Pro admin dashboard or public view."

prerequisites:
  - "LOAD: @rules/design-system.md"
  - "LOAD: @rules/animations.md"
  - "LOAD: @rules/react.md or @rules/frontend.md"
  - "LOAD: @context/cloudfold-context.md"

execution_steps:
  step_1_input_and_metadata_validation:
    action: "Analyze the user's input to ensure all necessary data is present for a 1:1 conversion."
    validation:
      - "Did the user provide exact color codes (Hex/RGB)?"
      - "Did the user provide font sizes, weights, and typography details?"
      - "Did the user provide specific spacing measurements (padding/margin)?"
    failure_action: "If metadata is missing, DO NOT write code. Politely ask the user to provide the exact colors, fonts, and spacing specs to ensure a 1:1 perfect match."

  step_2_constraint_enforcement:
    action: "Set strict boundaries for the generated code based on CloudFold Pro standards."
    rules:
      - "STRICT: ABSOLUTELY ZERO jQuery ($). Use document.querySelector or React state."
      - "STRICT: Must adhere to the 8px spacing grid (8, 16, 24, 32, 48px) unless specified otherwise in metadata."
      - "STRICT: Check if the required element already exists in 'admin/js/src/components/ui/' (e.g., Spinner, Toast, EmptyState) before creating a new one."
      - "STRICT: Determine the environment -> Admin block (React/JSX) vs Public View (Vanilla JS/HTML)."

  step_3_structural_drafting:
    action: "Create the semantic HTML/JSX structure before applying styles."
    accessibility_check:
      - "Ensure 'aria-labels' are present for all buttons and interactive elements."
      - "Images must have 'alt' text attributes."
      - "Use proper semantic tags (<button>, <article>, <section>, <nav>)."

  step_4_apply_1_to_1_styling:
    action: "Apply CSS/Tailwind classes using ONLY the provided metadata values. Zero guessing allowed."
    guidelines:
      - "Cross-reference the provided metadata with the visual hierarchy shown in the uploaded image."
      - "Apply exact background colors, text colors, and 'Soft Geometry' border radii (12px-16px)."
      - "Ensure 'Glassmorphism' principles are applied (color-mix for subtle borders)."
      - "Ensure interactive states (:hover, :focus, :active) are styled cleanly. Use macOS-style focus rings."

  step_5_apply_motion:
    action: "Inject motion tokens from @rules/animations.md to ensure the UI feels snappy and premium."
    guidelines:
      - "Micro-interactions (hovers, focus): 150ms ease."
      - "Macro-interactions (modals, drawers): .22s cubic-bezier(.22,1,.36,1)."
      - "REJECT any `transition: all`."

  step_6_final_code_review:
    action: "Self-correct and review the generated code before outputting to the user."
    checklist:
      - "Are there any jQuery ($) selectors? (If YES, rewrite immediately)."
      - "Are the exact spacing and color codes from Step 1 used?"
      - "Are the snappy motion and glassmorphism rules applied?"
      - "Is lazy loading (Intersection Observer) or srcset implemented if images are present?"
      - "Is the code clean, modular, and ready to be pasted into the CloudFold Pro codebase?"

output_format:
  - "Greeting: Briefly acknowledge the specific component being built."
  - "Code Block: Provide the complete, finalized code (JSX/JS/CSS) in a single, easy-to-copy block if possible."
  - "Brief Note: Mention where this code should be placed in the file tree (e.g., 'Save this in admin/js/src/components/gallery/')."